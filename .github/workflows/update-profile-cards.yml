name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/update-profile-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=333333&title_color=5FA0FE&text_color=FFFFFF&icon_color=5FA0FE
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=333333&title_color=5FA0FE&text_color=FFFFFF
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=333333&stroke=5FA0FE&ring=5FA0FE&fire=5FA0FE&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=5FA0FE&sideLabels=5FA0FE&dates=FFFFFF&disable_animations=true
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated SVG files
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          paths = [
              Path("assets/github-stats.svg"),
              Path("assets/top-langs.svg"),
              Path("assets/streak.svg"),
          ]
          blocked = ("something went wrong", "service unavailable", "deployment_paused")
          for path in paths:
              svg = path.read_text(encoding="utf-8")
              if any(marker in svg.lower() for marker in blocked):
                  raise ValueError(f"{path} contains an error response")
              ET.fromstring(svg)
              print(f"Validated {path}")

      - name: Commit updated cards
        shell: bash
        run: |
          if git diff --quiet -- assets; then
            echo "Cards are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: update profile cards"
          git push
